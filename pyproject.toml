[project]
name = "energy-forecasting"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "energy",
    "energy.data",
    "energy.features",
    "energy.models",
    "energy.api",
]

[tool.ruff]
line-length = 100