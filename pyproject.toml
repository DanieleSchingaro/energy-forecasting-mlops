[project]
name = "energy-forecasting"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "energy",
    "energy.data",
    "energy.features",
    "energy.models",
    "energy.api",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# Depends/Query/Body sono l'idioma documentato di FastAPI: la chiamata nel
# valore di default e' intenzionale, non una svista.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]