# Pipeline riproducibile: `dvc repro` riesegue solo gli stage i cui input
# (script, dati, parametri) sono cambiati.
stages:
  download:
    cmd: python -m energy.data.download_dataset
    deps:
      - src/energy/data/download_dataset.py
    outs:
      - data/raw/household_power_consumption.txt

  make_dataset:
    cmd: python -m energy.data.create_dataset
    deps:
      - src/energy/data/create_dataset.py
      - data/raw/household_power_consumption.txt
    outs:
      - data/processed/hourly.parquet

  baseline:
    cmd: python -m energy.models.baseline
    deps:
      - src/energy/models/baseline.py
      - src/energy/evaluation.py
      - src/energy/features/build.py
      - src/energy/config.py
      - src/energy/tracking.py
      - data/processed/hourly.parquet
    params:
      - configs/params.yaml:
          - data
          - features
          - split
          - mlflow
    metrics:
      - reports/baseline_metrics.json:
          cache: false

  train:
    cmd: python -m energy.models.train
    deps:
      - src/energy/models/train.py
      - src/energy/evaluation.py
      - src/energy/features/build.py
      - src/energy/config.py
      - src/energy/tracking.py
      - data/processed/hourly.parquet
      - reports/baseline_metrics.json
    params:
      - configs/params.yaml:
          - data
          - features
          - split
          - model
          - evaluation
          - mlflow
    outs:
      - models
      - reports/feature_importance:
          cache: false
    metrics:
      - reports/model_metrics.json:
          cache: false

  promote:
    cmd: python -m energy.models.promote
    deps:
      - src/energy/models/promote.py
      - src/energy/evaluation.py
      - src/energy/tracking.py
      - reports/model_metrics.json
      - reports/baseline_metrics.json
    params:
      - configs/params.yaml:
          - evaluation
          - mlflow
    outs:
      - reports/champion.json:
          cache: false

  report:
    cmd: python -m energy.report
    deps:
      - src/energy/report.py
      - src/energy/evaluation.py
      - src/energy/config.py
      - reports/baseline_metrics.json
      - reports/model_metrics.json
    params:
      - configs/params.yaml:
          - evaluation
    outs:
      - reports/summary.md:
          cache: false
      - reports/mae_by_horizon.csv:
          cache: false
      - reports/figures/mae_by_horizon.png:
          cache: false