# Servizi di supporto: il database delle misurazioni e il server MLflow.
# L'API verra' aggiunta qui quando sara' pronta.
#
#   docker compose up -d        avvia
#   docker compose ps           stato
#   docker compose logs -f      log
#   docker compose down         ferma (i volumi restano)
name: energy-forecasting

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-energy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energy}
      POSTGRES_DB: ${POSTGRES_DB:-energy}
    ports:
      # esposto sull'host perche' training e ingestione girano fuori dai container
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-mlflow-db.sh:/docker-entrypoint-initdb.d/init-mlflow-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-energy} -d ${POSTGRES_DB:-energy}"]
      interval: 5s
      timeout: 5s
      retries: 12

  mlflow:
    build:
      context: ./docker/mlflow
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION:-3.16.1}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://${POSTGRES_USER:-energy}:${POSTGRES_PASSWORD:-energy}@postgres:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination=/mlartifacts
      # dalla rete del compose le richieste arrivano con Host "mlflow:5000":
      # senza questo elenco il server le respinge come DNS rebinding
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlartifacts:/mlartifacts
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-energy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energy}
      POSTGRES_DB: ${POSTGRES_DB:-energy}
      # dentro la rete del compose i servizi si chiamano per nome
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # i 24 modelli vengono caricati all'avvio: la prima richiesta non aspetta
      API_PRELOAD_MODELS: "1"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"

volumes:
  pgdata:
  mlartifacts: