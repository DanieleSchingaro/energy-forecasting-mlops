#configs/params.yaml

#File relativo ai parametri del progetto.
#Gli script vengono lanciati da qui.

data:
  processed_path: data/processed/hourly.parquet
  target: global_active_power #kW medi nell'ora

features:
  horizon: 1 #si estende a 24 in seguito
  lags: [0, 1, 2, 3, 24, 25, 48, 168]
  rolling_windows: [24, 168] #finestre chiuse all'ora corrente inclusa

split:
  test_months: 12             # un ciclo stagionale completo nel test
  cv_splits: 5                # fold di TimeSeriesSplit sul solo training
  cv_gap_hours: 24            # righe scartate fra training e validation di ogni fold

model:
  random_forest:
    n_estimators: 300
    max_depth: 20
    min_samples_leaf: 5
    n_jobs: -1
    random_state: 42
  xgboost:
    n_estimators: 600
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    n_jobs: -1
    random_state: 42

evaluation:
  reference_baseline: best    # la naive piu' forte; oppure naive_1h / naive_24h / naive_168h

mlflow:
  tracking_uri: sqlite:///mlflow.db   # il Model Registry non funziona con il file store mlruns/
  experiment: energy-forecasting
  registered_model: energy-forecaster
  champion_alias: champion